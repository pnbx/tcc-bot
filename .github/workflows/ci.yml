name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          TELEGRAM_BOT_TOKEN: "0:ci-placeholder"
          BOT_API_TOKEN: "ci-placeholder"
          TCC_SITE_URL: "https://site.tccmc.ir"
